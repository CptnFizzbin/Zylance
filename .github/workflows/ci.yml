name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'copilot/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check_formatting:
    runs-on: ubuntu-latest
    name: Check Formatting
    steps:
      - uses: actions/checkout@v4
      - name: Restore dependencies
        run: |
          dotnet restore
          dotnet tool restore
      - name: Check code formatting
        run: dotnet csharpier check .

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Restore dependencies
        run: |
          dotnet restore
          dotnet tool restore

      - name: Check code formatting (CSharpier)
        run: dotnet csharpier check .
        continue-on-error: true

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Install Playwright Browsers
        run: pwsh tests/Zylance.Desktop.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: |
          dotnet test -c Release --no-restore --no-build --coverage --results-directory ./coverage
          dotnet coverage merge --output coverage/merged.cobertura.xml --output-format cobertura coverage/*.coverage

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: '**/*.cobertura.xml'
          badge: true
          format: markdown
          indicators: true
          output: both

  build-runtimes:
    name: Build for ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - runtime: win-x64
            os: windows-latest
            name: Windows x64

          # Linux x64
          - runtime: linux-x64
            os: ubuntu-latest
            name: Linux x64

          # Browser WebAssembly
          - runtime: browser-wasm
            os: ubuntu-latest
            name: Browser WASM

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install WASM workload
        if: matrix.runtime == 'browser-wasm'
        run: dotnet workload install wasm-tools

      - name: Restore for ${{ matrix.name }}
        run: dotnet restore -r ${{ matrix.runtime }}

      - name: Build Core for ${{ matrix.name }}
        run: dotnet build src/Zylance.Core/Zylance.Core.csproj -c Release -r ${{ matrix.runtime }} --no-restore

      - name: Build Desktop for ${{ matrix.name }}
        if: matrix.runtime != 'browser-wasm'
        run: dotnet build src/Zylance.Desktop/Zylance.Desktop.csproj -c Release -r ${{ matrix.runtime }} --no-restore

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [ test, build-runtimes ]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Check test results
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check runtime builds
        run: |
          echo "## 🏗️ Runtime Builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build-runtimes.result }}" == "success" ]; then
            echo "✅ All runtimes built successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Windows x64" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Linux x64" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Browser WASM" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some runtime builds failed (check individual jobs)" >> $GITHUB_STEP_SUMMARY
          fi
