syntax = "proto3";
package zylance.contract;

import "zylance/extensions/Zylance.proto";
import "zylance/models/Ledger.proto";

option csharp_namespace = "Zylance.Contract.Api.Ledger";

message LedgerFilter {
  optional string account_id = 1;
  optional string start_timestamp = 2; // ISO 8601 format
  optional string end_timestamp = 3; // ISO 8601 format
  optional string cursor = 5;
  optional uint32 page_size = 6;
}

// === Actions ===
// Create a new ledger entry
message CreateLedgerEntryReq {
  option (action) = "Ledger:CreateLedgerEntry";
  LedgerEntryData entry = 2;
}

message CreateLedgerEntryRes {
  option (action) = "Ledger:CreateLedgerEntry";
  LedgerEntryData entry = 1;
}

// Get a single ledger entry by ID
message GetLedgerEntryReq {
  option (action) = "Ledger:GetLedgerEntry";
  string id = 2;
}

message GetLedgerEntryRes {
  option (action) = "Ledger:GetLedgerEntry";
  LedgerEntryData entry = 1;
}

// List ledger entries with pagination
message ListLedgerEntriesReq {
  option (action) = "Ledger:ListLedgerEntries";
  optional LedgerFilter filter = 2;
}

message ListLedgerEntriesRes {
  option (action) = "Ledger:ListLedgerEntries";
  uint64 total_count = 1;
  string cursor = 2;
  bool last_page = 3;
  repeated LedgerEntryData entries = 4;
}

message UpdateLedgerEntryReq {
  option (action) = "Ledger:UpdateLedgerEntry";
  string id = 1;
  LedgerEntryData entry = 2;
}

message UpdateLedgerEntryRes {
  option (action) = "Ledger:UpdateLedgerEntry";
  LedgerEntryData entry = 1;
}

// Delete a ledger entry
message DeleteLedgerEntryReq {
  option (action) = "Ledger:DeleteLedgerEntry";
  string id = 1;
}

message DeleteLedgerEntryRes {
  option (action) = "Ledger:DeleteLedgerEntry";
  bool success = 1;
  LedgerEntryData entry = 2;
}

// Search ledger entries with advanced filtering
message SearchLedgerEntriesReq {
  option (action) = "Ledger:SearchLedgerEntries";
  string query = 2;
  optional LedgerFilter filter = 3;
}

message SearchLedgerEntriesRes {
  option (action) = "Ledger:SearchLedgerEntries";
  uint64 total_count = 1;
  string cursor = 2;
  bool last_page = 3;
  repeated LedgerEntryData entries = 4;
}
